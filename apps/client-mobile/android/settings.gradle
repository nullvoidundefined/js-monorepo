rootProject.name = 'ClientMobile'

// pnpm: RN packages in app's node_modules, CLI tools in root
def appRoot = file("../")
def monorepoRoot = file("../../../")

// Apply native modules from root (CLI is hoisted)
apply from: new File(monorepoRoot, "node_modules/@react-native-community/cli-platform-android/native_modules.gradle")
applyNativeModulesSettingsGradle(settings)

include ':app'
// RN gradle plugin is in app's node_modules
includeBuild(new File(appRoot, "node_modules/@react-native/gradle-plugin"))

